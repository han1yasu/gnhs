<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<Directory /var/www/html/database>
    Require all denied
</Directory>

<Directory /var/www/html/tools>
    Require all denied
</Directory>

<Directory /var/www/html/uploads>
    Options -Indexes
    <FilesMatch "(?i)\.php$">
        Require all denied
    </FilesMatch>
</Directory>

<FilesMatch "^\.env$|^router\.php$">
    Require all denied
</FilesMatch>
